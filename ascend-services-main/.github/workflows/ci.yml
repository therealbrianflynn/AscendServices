name: CI

on:
  pull_request:
  push:
    branches:
      - "feature/**"
      - "story/**"
      - "task/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + unit smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        env:
          # generate does not need a live DB; placeholder is fine
          DATABASE_URL: postgresql://ascend:ascend@localhost:5432/ascend_services?schema=public

      - name: Lint
        run: pnpm lint

      - name: Unit smoke
        run: pnpm test

  infra:
    name: Infrastructure unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test
