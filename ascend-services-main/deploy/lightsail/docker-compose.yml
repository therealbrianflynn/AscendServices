services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ascend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ascend_services
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascend -d ascend_services"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://ascend:${POSTGRES_PASSWORD}@db:5432/ascend_services?schema=public
      NODE_ENV: production
      PORT: "3000"
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?set AUTH_SESSION_SECRET in .env}
      AUTH_SESSION_TTL_HOURS: "24"
      MAGIC_LINK_TTL_MINUTES: "15"
      APP_BASE_URL: https://ascendservicesministry.org
      WEBAUTHN_RP_ID: ascendservicesministry.org
      WEBAUTHN_ORIGINS: https://ascendservicesministry.org
      WEBAUTHN_RP_NAME: Ascend Services
      EMAIL_TRANSPORT: log
      EMAIL_FROM: no-reply@ascendservicesministry.org
      # Temporary: production otherwise omits the magic-link body from the log.
      EMAIL_LOG_INCLUDE_BODY: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
